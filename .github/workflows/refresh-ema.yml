name: Refresh EMA Evidence Data

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/build_ema_data.py"
      - "requirements.txt"
      - ".github/workflows/refresh-ema.yml"
  schedule:
    - cron: "45 23 * * 0"

permissions:
  contents: write

jobs:
  refresh-ema:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build EMA datasets
        run: python scripts/build_ema_data.py --timeframe all
      - name: Commit EMA datasets
        shell: bash
        run: |
          git config user.name "scanner-evidence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/market/ema
          if git diff --cached --quiet; then
            echo "No EMA dataset changes to commit."
          else
            git commit -m "Refresh Yahoo EMA evidence data"
            git pull --rebase origin main
            git push
          fi
