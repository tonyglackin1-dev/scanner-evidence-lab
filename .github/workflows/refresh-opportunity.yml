name: Refresh Opportunity Evidence Data

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/build_opportunity_data.py"
      - "scripts/build_scan_data.py"
      - "requirements.txt"
      - ".github/workflows/refresh-opportunity.yml"
  schedule:
    - cron: "20 0 * * 0"

permissions:
  contents: write

jobs:
  refresh-opportunity:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build Yahoo historical opportunity datasets
        run: python scripts/build_opportunity_data.py

      - name: Commit opportunity datasets
        shell: bash
        run: |
          git config user.name "scanner-evidence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/market/opportunity
          if git diff --cached --quiet; then
            echo "No opportunity dataset changes to commit."
          else
            git commit -m "Refresh historical opportunity evidence data"
            git pull --rebase origin main
            git push
          fi
