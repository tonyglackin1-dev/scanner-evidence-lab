name: TAB racing results
on:
  push:
    paths:
      - "racing/**"
  workflow_dispatch:
jobs:
  collect:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Collect TAB results
        continue-on-error: true
        run: python racing/tab_results.py --validate-2026-10-05 --venue-map racing/tab_venue_codes.json --out racing/output/tab_results.csv
      - name: Show output
        shell: powershell
        run: |
          if (Test-Path racing/output/tab_results.csv) { Get-Content racing/output/tab_results.csv }
          if (Test-Path racing/output/tab_results.failures.json) { Get-Content racing/output/tab_results.failures.json }
      - uses: actions/upload-artifact@v4
        with:
          name: tab-racing-results
          path: racing/output/
