name: Refresh Scanner Data

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/build_scan_data.py"
      - "requirements.txt"
      - ".github/workflows/refresh-data.yml"
  schedule:
    - cron: "20 22 * * 1-5"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build Yahoo EOD scanner dataset
        run: python scripts/build_scan_data.py

      - name: Commit refreshed dataset
        run: |
          git config user.name "scanner-evidence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/scan_data.json
          if git diff --cached --quiet; then
            echo "No dataset changes to commit."
          else
            git commit -m "Refresh Yahoo scanner data"
            git push
          fi
