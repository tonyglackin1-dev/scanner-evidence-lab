name: Refresh Weekly Monthly Data

on:
  workflow_dispatch:
    inputs:
      timeframe:
        description: "Timeframe to rebuild"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - weekly
          - monthly
  push:
    branches: ["main"]
    paths:
      - "scripts/build_timeframe_data.py"
      - "scripts/build_scan_data.py"
      - "requirements.txt"
      - ".github/workflows/refresh-timeframes.yml"
  schedule:
    - cron: "40 23 * * 0"

permissions:
  contents: write

jobs:
  refresh-timeframes:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Choose timeframe
        id: tf
        shell: bash
        run: |
          TF="all"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TF="${{ inputs.timeframe }}"
          fi
          echo "timeframe=$TF" >> "$GITHUB_OUTPUT"
          echo "Timeframe rebuild: $TF"

      - name: Build Yahoo weekly and monthly datasets
        run: python scripts/build_timeframe_data.py --timeframe "${{ steps.tf.outputs.timeframe }}"

      - name: Commit refreshed timeframe datasets
        shell: bash
        run: |
          git config user.name "scanner-evidence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/market/weekly data/market/monthly
          if git diff --cached --quiet; then
            echo "No timeframe changes to commit."
          else
            git commit -m "Refresh Yahoo weekly/monthly scanner data"
            git pull --rebase origin main
            git push
          fi
